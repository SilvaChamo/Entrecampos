name: Newsletter agendada

# A Vercel (plano gratuito) só corre tarefas uma vez por dia; este agendador chama a rota
# que envia os horários agendados da newsletter cuja hora já chegou.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar horários que já chegaram
        run: |
          curl --fail --silent --show-error --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://entrecamposblog.com/api/cron/newsletter-agenda
